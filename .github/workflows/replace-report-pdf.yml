name: Replace optimized report PDF

on:
  push:
    branches: [main]
    paths:
      - '.final_pdf_upload/chunk_08.b64'

permissions:
  contents: write

jobs:
  replace-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify optimized PDF
        shell: bash
        run: |
          set -euo pipefail
          cat .final_pdf_upload/chunk_*.b64 | tr -d '\r\n' | base64 --decode > From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf
          echo '69fa2346ebe49317451efe73076f1013814036e46331ed939a9e7b38ff8a5576  From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf' | sha256sum --check
          test "$(stat -c%s From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf)" -eq 522541

      - name: Clean temporary upload files
        shell: bash
        run: |
          rm -rf .final_pdf_upload .final_upload .optimized_upload .pdf_upload .pdf_delta .github

      - name: Commit optimized report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace report PDF with optimized final version'
          git push
