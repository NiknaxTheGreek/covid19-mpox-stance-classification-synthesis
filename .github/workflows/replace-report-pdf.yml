name: Replace optimized report PDF

on:
  push:
    branches: [main]
    paths:
      - '.final_patch_upload20/chunk_20.b64'

permissions:
  contents: write

jobs:
  replace-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify current PDF
        shell: bash
        run: |
          set -euo pipefail
          echo '3585c6afcaff9d841a7ef65e55c4d08afbe31aa04396a9dc24b94d5e8ef080eb  From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf' | sha256sum --check

      - name: Reconstruct and verify optimized PDF
        shell: bash
        run: |
          set -euo pipefail
          cat .final_patch_upload20/chunk_*.b64 | tr -d '\r\n' | base64 --decode > final.patch.zst
          zstd -q -d --patch-from=From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf final.patch.zst -o report.new.pdf
          echo '69fa2346ebe49317451efe73076f1013814036e46331ed939a9e7b38ff8a5576  report.new.pdf' | sha256sum --check
          test "$(stat -c%s report.new.pdf)" -eq 522541
          mv report.new.pdf From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf

      - name: Clean temporary upload files
        shell: bash
        run: |
          rm -rf final.patch.zst .final_patch_upload20 .final_patch_upload .final_pdf_upload .final_upload .optimized_upload .pdf_upload .pdf_delta .github

      - name: Commit optimized report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace report PDF with optimized final version'
          git push
