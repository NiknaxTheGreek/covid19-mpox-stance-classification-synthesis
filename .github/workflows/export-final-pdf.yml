name: Export final COVID-Mpox PDF

on:
  push:
    branches: [final-upload]
    paths:
      - '.github/workflows/export-final-pdf.yml'
      - '.optimized_upload/export-trigger'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified PDF
        shell: bash
        run: |
          set -euo pipefail
          cat .optimized_upload/chunk_*.b64 | tr -d '\r\n' | base64 --decode > From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis_FINAL.pdf
          echo '2bcac47733cd2010154b8f83a98997b3cfdc0259d19880a4b77f54fd32ddec14  From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis_FINAL.pdf' | sha256sum --check
          test "$(stat -c%s From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis_FINAL.pdf)" -eq 184442
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: covid-mpox-final-pdf
          path: From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis_FINAL.pdf
          if-no-files-found: error
