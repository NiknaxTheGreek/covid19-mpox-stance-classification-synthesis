name: Replace report PDF

on:
  push:
    branches: [main]
    paths:
      - '.pdf_upload/part_035.b64'

permissions:
  contents: write

jobs:
  replace-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify updated PDF
        shell: bash
        run: |
          set -euo pipefail
          cat .pdf_upload/part_*.b64 | tr -d '\r\n' | base64 --decode > From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf
          echo '24e46f06b1a874bdb0cf3dbc7db3f42b6e7aff7b321622309195f7af4e0c9a5f  From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf' | sha256sum --check
          test "$(stat -c%s From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf)" -eq 527970

      - name: Clean temporary upload files
        shell: bash
        run: |
          rm -rf .pdf_upload .github

      - name: Commit updated report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Figures 2 and 4 with high-resolution versions'
          git push
