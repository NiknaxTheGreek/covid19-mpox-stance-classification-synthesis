name: Finalize report upload

on:
  push:
    branches: [main]
    paths:
      - '.final_tail/seg_04_0_exact.b64'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify exact PDF
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .upload_exact/part_00.b64
            cat .upload_exact/part_01.b64
            cat .upload_exact/part_02.b64
            cat .upload_exact/part_03.b64
            cat .upload_exact/part_04.b64
            cat .upload_exact/part_05.b64
            cat .upload_exact/part_06.b64
            cat .upload_exact/part_07.b64
            cat .upload_cont/tail_07.b64
            cat .upload_exact/part_08.b64
            cat .upload_exact/part_09.b64
            cat .upload_cont/cont_000.b64
            cat .upload_cont/cont_001.b64
            cat .upload_cont/cont_002.b64
            cat .upload_cont/cont_003.b64
            cat .upload_cont/cont_004.b64
            cat .upload_cont/cont_005.b64
            cat .upload_cont/cont_006.b64
            cat .upload_cont/cont_007.b64
            cat .upload_cont/cont_008.b64
            cat .upload_cont/cont_009.b64
            cat .upload_cont/cont_010.b64
            cat .upload_cont/cont_011.b64
            cat .final_tail/seg_00.b64
            cat .final_tail/seg_01.b64
            cat .final_tail/seg_02.b64
            cat .final_tail/seg_03_0.b64
            cat .final_tail/seg_03_1.b64
            cat .final_tail/seg_04_0_exact.b64
            cat .final_tail/seg_04_1.b64
            cat .final_tail/seg_05.b64
            cat .final_tail/seg_06.b64
            cat .final_tail/seg_07_0.b64
            cat .final_tail/seg_07_1.b64
            cat .final_tail/seg_08_0.b64
            cat .final_tail/seg_08_1.b64
            cat .final_tail/seg_09.b64
            cat .final_tail/seg_10_11.b64
          } | tr -d '\r\n' | base64 --decode > From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf
          echo '3585c6afcaff9d841a7ef65e55c4d08afbe31aa04396a9dc24b94d5e8ef080eb  From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf' | sha256sum --check
          test "$(stat -c%s From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf)" -eq 253080

      - name: Remove temporary upload files
        shell: bash
        run: |
          rm -rf .upload_exact .upload_chunks .upload_cont .final_tail .canonical .github
          rm -f .gitkeep

      - name: Commit final clean repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add final synthesis report PDF'
          git push
