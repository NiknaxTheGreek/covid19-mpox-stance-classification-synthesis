name: Replace report PDF

on:
  push:
    branches: [main]
    paths:
      - '.pdf_delta/part_013.b64'

permissions:
  contents: write

jobs:
  replace-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply and verify updated PDF delta
        shell: bash
        run: |
          set -euo pipefail
          cat .pdf_delta/part_*.b64 | tr -d '\r\n' | base64 --decode > report-delta.bin.gz
          gzip -dc report-delta.bin.gz >> From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf
          echo '0cb459af1fff7d2023969d95c96ded617f4afb43a212569eddd4ee4660cf4cc3  From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf' | sha256sum --check
          test "$(stat -c%s From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf)" -eq 506923

      - name: Clean temporary upload files
        shell: bash
        run: |
          rm -rf .pdf_delta .pdf_upload .github report-delta.bin.gz

      - name: Commit updated report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Figures 2 and 4 with high-resolution versions'
          git push
