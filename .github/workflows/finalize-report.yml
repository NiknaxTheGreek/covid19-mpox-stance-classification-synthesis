name: Finalize report upload

on:
  push:
    branches: [main]
    paths:
      - '.upload_exact/part_21.b64'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify PDF
        shell: bash
        run: |
          set -euo pipefail
          cat .upload_exact/part_*.b64 | tr -d '\r\n' | base64 --decode > From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf
          echo '3585c6afcaff9d841a7ef65e55c4d08afbe31aa04396a9dc24b94d5e8ef080eb  From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf' | sha256sum --check

      - name: Remove temporary upload files
        shell: bash
        run: |
          rm -rf .upload_exact .upload_chunks .github
          rm -f .gitkeep

      - name: Commit final repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add final synthesis report PDF'
          git push
