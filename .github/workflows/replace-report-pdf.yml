name: Replace optimized report PDF

on:
  push:
    branches: [main]
    paths:
      - '.optimized_upload/chunk_12.b64'

permissions:
  contents: write

jobs:
  replace-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify optimized PDF
        shell: bash
        run: |
          set -euo pipefail
          cat .optimized_upload/chunk_*.b64 | tr -d '\r\n' | base64 --decode > From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf
          echo '2bcac47733cd2010154b8f83a98997b3cfdc0259d19880a4b77f54fd32ddec14  From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf' | sha256sum --check
          test "$(stat -c%s From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf)" -eq 184442

      - name: Clean temporary upload files
        shell: bash
        run: |
          rm -rf .optimized_upload .pdf_upload .github

      - name: Commit optimized report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace report PDF with optimized final version'
          git push
