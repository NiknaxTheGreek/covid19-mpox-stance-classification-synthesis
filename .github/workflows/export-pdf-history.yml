name: Export PDF history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-pdf-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export candidate report PDFs
        shell: bash
        run: |
          set -u
          mkdir -p exported
          extract() {
            sha="$1"; path="$2"; out="$3"
            if git cat-file -e "${sha}:${path}" 2>/dev/null; then
              git show "${sha}:${path}" > "exported/${out}"
              echo "${out} $(stat -c%s "exported/${out}") bytes"
            else
              echo "missing ${sha}:${path}"
            fi
          }
          extract 287487c81d5816779365481c2bee48eebb39804c From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf 01_base_287487.pdf
          extract 52a87923a0edc6612fb27c8b1e0eba264e88a670 From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf 02_candidate_52a879.pdf
          extract 7ce1ce2c983d5aa325b92ebea65d88731f9fce33 From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf 03_candidate_7ce1ce.pdf
          extract 1a12f37d73dbbb9ac6f26cf3cb603089822058a9 From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis.pdf 04_candidate_1a12f3.pdf
          extract e7e6f3266f6a229cc77d62c792391a032261567f From_COVID19_Vaccine_Hesitancy_to_Mpox_Comparative_Synthesis_optimized-2.pdf 05_latest_broken_e7e6f3.pdf
          sha256sum exported/* || true

      - name: Upload candidates
        uses: actions/upload-artifact@v4
        with:
          name: historical-pdf-candidates
          path: exported/*.pdf
          if-no-files-found: error
